name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats coreutils grep gawk hostname iproute2 man-db mawk make ncurses-bin procps python3 sed shellcheck
      - name: Check syntax and lint
        run: |
          bash -n pc-command-center.sh
          shellcheck pc-command-center.sh
      - name: Run regression tests
        run: |
          bats --print-output-on-failure tests
          python3 tests/terminal.py
      - name: Test source installation and removal
        run: |
          stage="$RUNNER_TEMP/pcc-source-install"
          make install PREFIX=/usr DESTDIR="$stage"
          test "$("$stage/usr/bin/pcc" --version)" = "PC Command Center $(sed -n 's/^VERSION="\([0-9][^"]*\)"/\1/p' pc-command-center.sh)"
          man -M "$stage/usr/share/man" -w pcc >/dev/null
          make uninstall PREFIX=/usr DESTDIR="$stage"
          test ! -e "$stage/usr/bin/pcc"
          test ! -e "$stage/usr/share/man/man1/pcc.1"
      - name: Build, install, run, and remove Debian package
        run: |
          version=$(sed -n 's/^VERSION="\([0-9][^"]*\)"/\1/p' pc-command-center.sh)
          ./packaging/build-deb.sh "$version" "$RUNNER_TEMP/pcc-deb"
          sudo dpkg -i "$RUNNER_TEMP/pcc-deb/pc-command-center_${version}_all.deb"
          test "$(pcc --version)" = "PC Command Center $version"
          man -w pcc >/dev/null
          TERM= COLUMNS=80 LINES=24 pcc --once --no-color > "$RUNNER_TEMP/pcc-smoke.txt"
          grep -q 'PC COMMAND CENTER' "$RUNNER_TEMP/pcc-smoke.txt"
          sudo dpkg -r pc-command-center
          test ! -e /usr/bin/pcc
          test ! -e /usr/share/man/man1/pcc.1
